[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymovis"
version = "0.1.0"
description = "Molecular Orbital Visualization System - A Python package for visualizing molecular orbitals from quantum chemistry calculations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Yusuke Sugenami", email = "yusuke.sugenami@akane.waseda.jp"}
]
keywords = ["quantum chemistry", "molecular orbitals", "visualization", "3D rendering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "periodictable>=2.1.0",
    "pyscf>=2.13.0",
    "pyvista>=0.48.4",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "isort>=5.0",
]

[project.urls]
Repository = "https://github.com/YusukeSugenami/pymovis"

[project.scripts]
pymovis = "pymovis.pymovis:main"

[tool.hatch.build.targets.wheel]
packages = ["pymovis"]

[tool.hatch.build.targets.wheel.force-include]
"pymovis/test_data" = "pymovis/test_data"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 100
